name: Test and Deploy Lambda Auth

on:
  repository_dispatch:
    types: [deploy-lambda-auth]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install and test
        run: |
          cd src
          npm ci
          npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    concurrency:
      group: lambda-auth-deploy
      cancel-in-progress: false
    env:
      TF_VAR_db_name: ${{ secrets.TF_VAR_db_name }}
      TF_VAR_db_user: ${{ secrets.TF_VAR_db_user }}
      TF_VAR_db_password: ${{ secrets.TF_VAR_db_password }}
      TF_VAR_jwt_secret: ${{ secrets.TF_VAR_jwt_secret }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Install Lambda dependencies
        run: |
          cd src
          npm ci --omit=dev

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Terraform init
        run: |
          for attempt in 1 2 3; do
            echo "Running terraform init (attempt ${attempt}/3)"
            set +e
            terraform init 2>&1 | tee /tmp/terraform-init.log
            status=${PIPESTATUS[0]}
            set -e

            if [ "$status" -eq 0 ]; then
              break
            fi

            if grep -q "state data in S3 does not have the expected content" /tmp/terraform-init.log && [ "$attempt" -lt 3 ]; then
              echo "Detected transient S3/DynamoDB state checksum mismatch. Waiting 90 seconds before retry..."
              sleep 90
              continue
            fi

            exit "$status"
          done

      - name: Terraform apply
        run: terraform apply -auto-approve
